name: Export Metrics to GCS (with Workload Identity Federation)

on:
  workflow_run:
    workflows: ["*"]  # After all workflow executions
    types:
      - completed

  # Can also be triggered manually
  workflow_dispatch:

jobs:
  export-metrics:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC token
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure GCS credentials with Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions@my-project.iam.gserviceaccount.com'

      # Credentials are automatically obtained from google-github-actions/auth
      - name: Export GitHub Actions Metrics
        uses: ./  # When using your own repository
        # uses: owner/gh-action-exporter@v1  # When using a release version
        with:
          storage_type: gcs
          bucket: my-metrics-bucket
          prefix: github-actions/metrics
          partition_by: day
          # gcp_credentials is not required
          # google-github-actions/auth sets environment variables

      - name: Show results
        run: |
          echo "Metrics exported successfully!"
          echo "Records: ${{ steps.export.outputs.record_count }}"
          echo "Location: ${{ steps.export.outputs.uploaded_url }}"

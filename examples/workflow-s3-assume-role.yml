name: Export Metrics to S3 (with Assume Role)

on:
  workflow_run:
    workflows: ["*"]  # After all workflow executions
    types:
      - completed

  # Can also be triggered manually
  workflow_dispatch:

jobs:
  export-metrics:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC token
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure AWS credentials with IAM role
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsRole
          aws-region: us-east-1

      # Credentials are automatically obtained from aws-actions/configure-aws-credentials
      - name: Export GitHub Actions Metrics
        uses: ./  # When using your own repository
        # uses: owner/gh-action-exporter@v1  # When using a release version
        with:
          storage_type: s3
          bucket: my-metrics-bucket
          prefix: github-actions/metrics
          partition_by: day
          # aws_access_key_id and aws_secret_access_key are not required
          # aws-actions/configure-aws-credentials sets environment variables

      - name: Show results
        run: |
          echo "Metrics exported successfully!"
          echo "Records: ${{ steps.export.outputs.record_count }}"
          echo "Location: ${{ steps.export.outputs.uploaded_url }}"

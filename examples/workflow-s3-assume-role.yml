name: Export Metrics to S3 (with Assume Role)

on:
  workflow_run:
    workflows: ["*"]  # 全てのワークフロー実行後
    types:
      - completed

  # 手動実行も可能
  workflow_dispatch:

jobs:
  export-metrics:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC トークンの取得に必要
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS 認証情報を IAM ロールで設定
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsRole
          aws-region: us-east-1

      # 認証情報は aws-actions/configure-aws-credentials から自動的に取得される
      - name: Export GitHub Actions Metrics
        uses: ./  # 自身のリポジトリを使用する場合
        # uses: owner/gh-action-exporter@v1  # リリース版を使用する場合
        with:
          storage_type: s3
          bucket: my-metrics-bucket
          prefix: github-actions/metrics
          partition_by: day
          # aws_access_key_id と aws_secret_access_key は不要
          # aws-actions/configure-aws-credentials が環境変数を設定する

      - name: Show results
        run: |
          echo "Metrics exported successfully!"
          echo "Records: ${{ steps.export.outputs.record_count }}"
          echo "Location: ${{ steps.export.outputs.uploaded_url }}"
